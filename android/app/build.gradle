apply plugin: 'com.android.application'

android {
    namespace 'com.thoigianbieu.kiemsoat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.thoigianbieu.kiemsoat'
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khoá debug để cài tay được ngay, không cần tạo keystore riêng.
            signingConfig signingConfigs.debug
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
