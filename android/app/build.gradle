apply plugin: 'com.android.application'

android {
    namespace 'com.thoigianbieu.kiemsoat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.thoigianbieu.kiemsoat'
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 14
        versionName '2.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // KÃ½ báº±ng khoÃ¡ debug Ä‘á»ƒ cÃ i tay Ä‘Æ°á»£c ngay, khÃ´ng cáº§n táº¡o keystore riÃªng.
            signingConfig signingConfigs.debug
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
